name: 🚀 Build & Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Sync & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build React App
        run: npm run build

      - name: 🔄 Sync Library Data (Headless)
        run: node scripts/sync-library.js
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'

      - name: 📂 Prepare API files
        run: |
          mkdir -p dist/api
          cp backend-php/index.php dist/api/index.php
          cp public/api/library_data.json dist/api/library_data.json

      - name: 🚀 FTP Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
